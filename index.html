      #pcai-consent.pcai-show{display:block}
      #pcai-consent .pcai-in{max-width:1080px;margin:0 auto;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}

      #pcai-consent button{border:0;border-radius:8px;padding:10px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
      #pcai-consent .pcai-ok{background:#2dd4bf;color:#06251f}
      #pcai-consent .pcai-ok:hover{background:#5eead4}
      #pcai-consent .pcai-no{background:transparent;color:#cbd5e1;border:1px solid #475569}
      #pcai-consent .pcai-no:hover{border-color:#94a3b8}
    </style>
    <div id="pcai-consent" role="dialog" aria-live="polite" aria-label="Cookie consent">
      <div class="pcai-in">
        <p>We use cookies for anonymous statistics (Google Analytics) to improve our website &mdash; only with your consent. Essential functions are unaffected. More in our <a href="/privacy">Privacy Policy</a>.</p>
        <div class="pcai-btns">
          <button class="pcai-no" id="pcai-no" type="button">Decline</button>
          <button class="pcai-ok" id="pcai-ok" type="button">Accept</button>
        </div>
      </div>
    </div>
    <script>
      (function(){
        function gtag(){window.dataLayer=window.dataLayer||[];window.dataLayer.push(arguments);}
        var el=document.getElementById('pcai-consent');
        if(!el)return;
        var stored=null; try{stored=localStorage.getItem('pcai_consent');}catch(e){}
        if(!stored){el.classList.add('pcai-show');}
        function choose(v){
          try{localStorage.setItem('pcai_consent',v);}catch(e){}
          gtag('consent','update',{'analytics_storage': v==='granted'?'granted':'denied'});
          el.classList.remove('pcai-show');
        }
        var ok=document.getElementById('pcai-ok'), no=document.getElementById('pcai-no');
        if(ok)ok.addEventListener('click',function(){choose('granted');});
        if(no)no.addEventListener('click',function(){choose('decline');});
      })();
    </script>
